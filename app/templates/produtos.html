{% extends 'template.html' %}

{% block titulo %}Produtos | Django{% endblock %}

{% block conteudo %}
    <h2>Produtos da API</h2>
        {% for prod in produtos_api %}
            <hr>
            <img src="{{ prod.image }}" alt = "{{ prod.title }}">
            <h3>{{ prod.title }} </h3>
            <p>{{ prod.description }}</p>
            <p>R$ {{ prod.price }}</p>
        {% empty %}
            <p>Nenhum produto encontrado na api.</p>
        {% endfor %}

{% endblock %}
